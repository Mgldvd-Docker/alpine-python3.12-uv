name: Publish Docker image

on:
  push:
    branches:
      - deploy/hub
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: alpine-python3.12-uv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 🏅 Checkout repository
        uses: actions/checkout@v4

      - name: 🏅 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏅 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏅 Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=alpine-python3.12-uv
            org.opencontainers.image.description=Alpine Python 3.12 image with uv, Bash tooling, and a non-root user; Docker Hub overview: https://hub.docker.com/r/mgldvd/alpine-python3.12-uv; source: https://github.com/Mgldvd-Docker/alpine-python3.12-uv
            org.opencontainers.image.url=https://github.com/Mgldvd-Docker/alpine-python3.12-uv
            org.opencontainers.image.source=https://github.com/Mgldvd-Docker/alpine-python3.12-uv
            org.opencontainers.image.documentation=https://hub.docker.com/r/mgldvd/alpine-python3.12-uv

      - name: 🏅 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏅 Update Docker Hub overview
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mgldvd/alpine-python3.12-uv
          short-description: Alpine Python 3.12 image with uv, Bash tooling, and sudo-enabled user
          readme-filepath: ./README.md

      - name: 🏅 Log out from Docker Hub
        run: docker logout
